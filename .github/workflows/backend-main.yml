name: Backend Main
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r back/requirements.txt
      - name: Run tests
        run: PYTHONPATH=./back python3 -m pytest back/tests --maxfail=1 --disable-warnings -q
